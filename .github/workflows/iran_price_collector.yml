name: Iran Market Daily Price Collector

on:
  schedule:
    - cron: '0 7 * * *' # هر روز ساعت ۱۰:۳۰ صبح به وقت ایران (بعد از باز شدن بازار)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-save:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run price collector
        run: python iran_price_collector.py

      - name: Commit and push if changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add iran_market_prices.csv
          if git diff --staged --quiet; then
            echo "تغییری در قیمت‌ها ثبت نشده است."
          else
            git commit -m "chore: update iran market prices $(date)"
            git push
          fi
