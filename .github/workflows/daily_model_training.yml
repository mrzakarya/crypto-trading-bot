name: Daily AI Model Training

on:
  schedule:
    - cron: '0 9 * * *' # هر روز ساعت ۱۲:۳۰ ظهر به وقت ایران
  workflow_dispatch: # امکان اجرای دستی

# اعطای دسترسی نوشتن به کل ورک‌فلو برای جلوگیری از خطای 128
permissions:
  contents: write

jobs:
  train-model:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train AI models
        run: python train_model.py
        continue-on-error: true # اگر داده کم بود و اسکریپت زود تمام شد، کل فرآیند قرمز نشود

      - name: Commit and push report
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 🔥 بررسی هوشمند: فقط اگر فایل وجود داشت آن را اضافه کن
          if [ -f model_performance_report.csv ]; then
            git add model_performance_report.csv
            if git diff --staged --quiet; then
              echo "تغییری در گزارش مدل وجود ندارد."
            else
              git commit -m "chore: update model performance report $(date)"
              git push
            fi
          else
            echo "⚠️ فایل گزارش هنوز ساخته نشده است (داده‌ها برای آموزش کافی نیستند). این یک رفتار طبیعی است و خطایی رخ نداده."
          fi
