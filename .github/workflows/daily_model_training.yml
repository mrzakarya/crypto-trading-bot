name: Daily AI Model Training

on:
  schedule:
    - cron: '0 9 * * *' # هر روز ساعت ۱۲:۳۰ ظهر به وقت ایران (بعد از جمع‌آوری اخبار)
  workflow_dispatch: # امکان اجرای دستی

permissions:
  contents: write

jobs:
  train-model:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train AI models
        run: python train_model.py

      - name: Commit and push report
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add model_performance_report.csv
          
          if git diff --staged --quiet; then
            echo "تغییری در گزارش مدل وجود ندارد."
          else
            git commit -m "chore: update model performance report $(date)"
            git push
          fi
