name: Daily Crypto News Collector

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

# 🔥 رفع خطای 128: اعطای اجازه نوشتن به گیت‌هاب اکشن
permissions:
  contents: write

jobs:
  collect-and-save:
    runs-on: ubuntu-latest
    
    steps:
      # 🔥 رفع هشدار: آپدیت به نسخه 4
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 🔥 رفع هشدار: آپدیت به نسخه 5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news collector
        run: python news_collector.py

      # 🔥 منطق هوشمند گیت: فقط در صورتی کامیت می‌کند که واقعاً تغییری ایجاد شده باشد
      - name: Commit and push if changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add crypto_news_dataset.csv
          
          # بررسی وجود تغییرات قبل از کامیت (جلوگیری از خطای احتمالی)
          if git diff --staged --quiet; then
            echo "هیچ تغییر جدیدی در داده‌ها وجود ندارد. Skip."
          else
            git commit -m "chore: update crypto news dataset $(date)"
            git push
          fi
