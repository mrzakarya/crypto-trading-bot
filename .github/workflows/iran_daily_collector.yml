name: Iran Market Daily News Collector

# زمان‌بندی: هر روز راس ساعت 6:30 صبح به وقت UTC (حدود 10:00 صبح به وقت ایران)
# این زمان قبل از باز شدن بورس تهران (۹ صبح) است تا اخبار شبانه را جمع‌آوری کند
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch: # امکان اجرای دستی

jobs:
  collect-and-save:
    runs-on: ubuntu-latest
    
    steps:
      # ۱. دانلود کدهای مخزن
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ۲. نصب پایتون
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # ۳. نصب کتابخانه‌ها (شامل hazm برای فارسی)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ۴. اجرای اسکریپت جمع‌آوری اخبار ایران
      - name: Run Iran news collector
        run: python iran_news_collector.py

      # ۵. ذخیره خودکار دیتاست ایران
      - name: Commit and push if changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add iran_market_news_dataset.csv
          git commit -m "chore: update iran market news dataset $(date)" || echo "No changes to commit"
          git push
