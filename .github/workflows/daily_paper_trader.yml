name: Daily Paper Trader

on:
  schedule:
    - cron: '0 10 * * *' # هر روز ساعت ۱۳:۳۰ به وقت ایران (بعد از بسته شدن کندل روزانه)
  workflow_dispatch: # امکان اجرای دستی

permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Paper Trader
        run: python paper_trader.py

      - name: Commit and push log
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add paper_trading_log.csv
          
          if git diff --staged --quiet; then
            echo "تغییری در لاگ Paper Trader وجود ندارد."
          else
            git commit -m "chore: update paper trading log $(date)"
            git push
          fi
